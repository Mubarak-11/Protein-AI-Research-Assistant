<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 1040 1320" role="img" aria-labelledby="title desc">
  <title id="title">Protein AI Research Assistant — System Architecture</title>
  <desc id="desc">Google ADK agent architecture with local prediction, hybrid protein retrieval, guarded BigQuery access, UniProt verification, and a Protein Structure Studio handoff.</desc>
